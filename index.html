<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alan的魔术箱</title>
<meta name="description" content="自己做、自己用的小工具合集。点开就能用。">
<link rel="stylesheet" href="support.css">
<style>
:root{--teal:#0e8aa0;--violet:#6a5be0;--ink:#12263a;--mute:#5b6b7b;--line:#e1e8ef;
 font:16px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
 background:radial-gradient(900px 420px at 8% -5%,#cfe6ee 0,transparent 70%),radial-gradient(800px 420px at 100% 0,#e6e2fa 0,transparent 70%),#f4f7fa}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.wrap{width:min(92vw,940px);margin:0 auto;padding:40px 0 24px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.32em;color:var(--teal);margin:0}
h1{margin:4px 0 6px;font-size:clamp(36px,8vw,56px);line-height:1.15;font-weight:800;
 background:linear-gradient(90deg,var(--teal),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 26px;color:var(--mute)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.bar input{flex:1 1 240px;min-width:0;font:inherit;font-size:15px;padding:11px 18px;border:1px solid var(--line);border-radius:999px;background:#fff}
.chip{font:inherit;font-size:14px;padding:9px 18px;border:0;border-radius:999px;background:#e8edf5;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:18px;min-height:210px}
.card .top{display:flex;justify-content:space-between;align-items:center}
.ico{font-size:30px;line-height:1}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:#eef1f5;color:#7a8794}
.live .badge{background:#d9f5e5;color:#1c8a4f}
.card h3{margin:6px 0 0;font-size:18px}
.card p{margin:0;font-size:14px;color:var(--mute);flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;color:var(--teal);border:1px solid #bfe2ea;border-radius:6px;padding:0 8px;background:#f6fcfd}
.open{font-size:14px;font-weight:700;color:var(--teal)}
a.card:hover{border-color:#a9d4de;box-shadow:0 8px 24px rgba(14,138,160,.12)}
.soon{opacity:.62}
.empty{display:none;text-align:center;color:var(--mute);padding:40px 0}
footer{text-align:center;font-size:13px;color:var(--mute);padding:36px 0 20px}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">PERSONAL AI LAB</p>
  <h1>Alan的魔术箱</h1>
  <p class="sub">自己做、自己用的小工具合集。点开就能用。</p>

  <div class="bar">
    <input id="q" type="search" placeholder="搜索工具…" aria-label="搜索工具">
    <button class="chip" data-c="all" aria-pressed="true">全部</button>
    <button class="chip" data-c="娱乐" aria-pressed="false">娱乐</button>
    <button class="chip" data-c="其他" aria-pressed="false">其他</button>
  </div>

  <div class="grid" id="grid">
    <a class="card live" href="fortune.html" data-c="娱乐">
      <div class="top"><span class="ico">🏮</span><span class="badge">● 已上线</span></div>
      <h3>赛博求签</h3><p>走进晴日山间道观，摇一支签，查看今日签文和解签。</p>
      <div class="tags"><span>娱乐</span><span>每日一签</span></div><span class="open">打开 →</span>
    </a>
    <a class="card live" href="play-mmr.html" data-c="娱乐">
      <div class="top"><span class="ico">🎮</span><span class="badge">● 已上线</span></div>
      <h3>重装机兵 回归 v8</h3><p>完整剧情、浏览器存档与 Three.js 拉多村探索，打开即可游玩。</p>
      <div class="tags"><span>娱乐</span><span>游戏</span><span>3D</span></div><span class="open">打开 →</span>
    </a>
    <div class="card soon" data-c="其他">
      <div class="top"><span class="ico">➕</span><span class="badge">即将上线</span></div>
      <h3>更多工具</h3><p>新做的工具会陆续加到这里。</p>
      <div class="tags"><span>敬请期待</span></div>
    </div>
  </div>
  <p class="empty" id="empty">没有找到匹配的工具。</p>
  <footer>© <script>document.write(new Date().getFullYear())</script> Alan的魔术箱 · 持续更新中</footer>
</div>
<button class="support-launch" id="support-launch" type="button" aria-haspopup="dialog" aria-controls="support">
  <span aria-hidden="true">♡</span> 请 Alan 吃点东西
</button>
<dialog class="support-dialog" id="support" aria-labelledby="support-title">
  <div class="support-header">
    <h2 id="support-title">请 Alan 吃点东西</h2>
    <form method="dialog"><button class="support-close" type="submit" aria-label="关闭" autofocus>×</button></form>
  </div>
  <fieldset class="support-options">
    <legend>选一份小心意</legend>
    <label><input type="radio" name="support-item" value="1.6" checked><span><i aria-hidden="true">💧</i> 矿泉水 <b>¥1.6</b></span></label>
    <label><input type="radio" name="support-item" value="6.6"><span><i aria-hidden="true">🍋</i> 柠檬水 <b>¥6.6</b></span></label>
    <label><input type="radio" name="support-item" value="16"><span><i aria-hidden="true">🍱</i> 拼好饭 <b>¥16</b></span></label>
    <label><input type="radio" name="support-item" value="26"><span><i aria-hidden="true">🍔</i> 汉堡套餐 <b>¥26</b></span></label>
  </fieldset>
  <p class="support-instruction" role="status">微信扫码，手动输入 <strong id="support-amount">¥1.6</strong></p>
  <figure class="support-qr">
    <div class="support-qr-frame">
      <img alt="Alan 的微信收款二维码" width="1280" height="1770" data-src="assets/wechat-support.jpg">
    </div>
  </figure>
  <a class="support-save" href="assets/wechat-support.jpg" download="Alan-微信收款码.jpg">保存收款码，在微信中识别</a>
</dialog>
<script>
const q=document.getElementById('q'),cards=[...document.querySelectorAll('.card')],chips=[...document.querySelectorAll('.chip')];
let cat='all';
function apply(){const t=q.value.trim().toLowerCase();let n=0;
 cards.forEach(c=>{const ok=(cat==='all'||c.dataset.c===cat)&&c.textContent.toLowerCase().includes(t);c.style.display=ok?'':'none';if(ok)n++});
 document.getElementById('empty').style.display=n?'none':'block'}
q.addEventListener('input',apply);
chips.forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.c;chips.forEach(x=>x.setAttribute('aria-pressed',x===b));apply()}));

const supportDialog = document.getElementById('support');
const supportImage = supportDialog.querySelector('img');
document.getElementById('support-launch').addEventListener('click', () => {
  if (!supportImage.hasAttribute('src')) supportImage.src = supportImage.dataset.src;
  supportDialog.showModal();
});
supportDialog.querySelector('.support-options').addEventListener('change', event => {
  document.getElementById('support-amount').textContent = '¥' + event.target.value;
});
</script>
</body>
</html>
