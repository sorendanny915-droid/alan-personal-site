<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>赛博求签 · Alan的魔术箱</title>
<meta name="description" content="在晴日山间道观摇一支签，查看今日原创签文与解签。">
<link rel="preload" href="assets/temple-sunrise.jpg" as="image">
<link rel="stylesheet" href="fortune.css">
</head>
<body>
<header class="site-header">
  <a href="index.html">← Alan的魔术箱</a>
  <span>每日一签</span>
</header>
<main>
  <section class="hero" aria-labelledby="title">
    <div class="hero-copy">
      <h1 id="title">赛博求签</h1>
      <time id="date"></time>
    </div>
  </section>
  <div class="layout">
    <section class="draw" aria-labelledby="draw-title">
      <div class="stage" aria-hidden="true">
        <div class="tube" id="tube">
          <span class="stick" style="--x:16%;--angle:-17deg;--rise:9px"></span>
          <span class="stick" style="--x:32%;--angle:-9deg;--rise:19px"></span>
          <span class="stick drawn-stick" style="--x:49%;--angle:1deg;--rise:29px"></span>
          <span class="stick" style="--x:65%;--angle:12deg;--rise:18px"></span>
          <span class="stick" style="--x:78%;--angle:19deg;--rise:8px"></span>
          <span class="vessel"><span>签</span></span>
        </div>
      </div>
      <div>
        <h2 id="draw-title">摇签</h2>
        <p id="hint" role="status">心里想一件事，再摇一支签。</p>
        <button class="go" id="go" type="button" aria-controls="card">摇签</button>
        <noscript><p>请启用 JavaScript 后求签。</p></noscript>
      </div>
    </section>
    <section class="paper" id="card" aria-labelledby="result-title">
      <h2 id="result-title" tabindex="-1">今日签文</h2>
      <p class="placeholder" id="placeholder">摇签后，在这里查看签文与解签。</p>
      <div id="result" hidden>
        <div class="result-heading"><p id="no"></p><p id="lv"></p></div>
        <p class="poem" id="poem"></p>
        <dl id="say"></dl>
      </div>
    </section>
  </div>
</main>
<footer>原创签文 · 仅供娱乐</footer>

<script>
const F=[
{lv:"上上",p:["潮平两岸阔","风正一帆悬","旧账今朝了","新程自向前"],s:{事业:"拖着的事能落地，放手推一把。",财运:"有小额进账，别急着再投出去。",感情:"主动说一句实话，比猜来猜去管用。",出行:"顺风，宜早不宜晚。"}},
{lv:"上",p:["灯下改旧稿","字字有回声","莫嫌慢半步","慢处见真功"],s:{事业:"适合打磨已有的东西，不宜另起炉灶。",财运:"稳，开销留一点余量。",感情:"耐心听对方说完。",出行:"近处走走就好。"}},
{lv:"上",p:["云散月自明","何须问东西","守得三更静","天亮鸟先啼"],s:{事业:"别被杂音带跑，按原计划走。",财运:"不动即是赚。",感情:"保持距离反而更舒服。",出行:"天气好，适合散心。"}},
{lv:"中上",p:["小舟过浅滩","擦底不翻船","看清水深处","再行莫贪欢"],s:{事业:"有点磕碰，但能过，别硬冲。",财运:"小心冲动消费。",感情:"别在气头上回消息。",出行:"留够时间，避开高峰。"}},
{lv:"中",p:["雾里看灯塔","忽远又忽近","不必急着靠","等雾散再行"],s:{事业:"信息不全，先别下结论。",财运:"持平，暂不做大决定。",感情:"顺其自然。",出行:"可去可不去。"}},
{lv:"中",p:["一线牵风筝","松紧要自知","太紧线易断","太松随风移"],s:{事业:"掌握节奏，别催别人也别催自己。",财运:"按预算来。",感情:"给彼此一点空间。",出行:"适合短途。"}},
{lv:"中上",p:["旧锚今可起","新港在前头","莫恋熟水域","一步便是秋"],s:{事业:"换个做法，可能比死磕有效。",财运:"开新源比省开支更有用。",感情:"该翻篇的翻篇。",出行:"可以尝试没去过的地方。"}},
{lv:"上上",p:["满帆迎朝阳","一路皆顺风","所求皆有应","莫忘谢同行"],s:{事业:"贵人在身边，记得道声谢。",财运:"有意外之喜。",感情:"心意相通的一天。",出行:"万事顺利。"}},
{lv:"中下",p:["暗礁藏浪下","无声最难防","慢行多看图","稳过便无妨"],s:{事业:"细节容易出错，交付前多检查一遍。",财运:"当心小额漏财。",感情:"言语留余地。",出行:"出发前再确认一次。"}},
{lv:"中",p:["夜航不见岸","舵稳心自宁","星在云后面","明日必晴明"],s:{事业:"过渡期，坚持就好。",财运:"平稳。",感情:"安静陪伴胜过多言。",出行:"夜里少赶路。"}},
{lv:"上",p:["炉边煮清茶","一盏解千愁","事缓则圆日","人和万事周"],s:{事业:"多沟通，少单打独斗。",财运:"人情往来有进账。",感情:"一顿好饭胜过千言。",出行:"约上朋友一起。"}},
{lv:"下",p:["风急浪头高","今日莫远行","收帆回港湾","明朝再扬鞭"],s:{事业:"今天别硬撑，先把能做的做完。",财运:"别做大决定。",感情:"先睡一觉再说。",出行:"尽量留在原地。"}}
];
const tube = document.getElementById('tube');
const go = document.getElementById('go');
const hint = document.getElementById('hint');
const dateLabel = document.getElementById('date');
const resultTitle = document.getElementById('result-title');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let currentDate;
let drawn;

function todayKey(date) {
  return [date.getFullYear(), date.getMonth() + 1, date.getDate()].join('-');
}

function fortuneIndex(key) {
  let hash = 2166136261;
  for (const character of key) {
    hash = Math.imul(hash ^ character.charCodeAt(0), 16777619) >>> 0;
  }
  return hash % F.length;
}

function reveal() {
  const index = fortuneIndex(currentDate);
  const fortune = F[index];
  document.getElementById('no').textContent = `第 ${index + 1} 签`;
  document.getElementById('lv').textContent = fortune.lv;
  document.getElementById('poem').textContent = fortune.p.join('\n');
  const interpretations = Object.entries(fortune.s).map(([label, value]) => {
    const item = document.createElement('div');
    const term = document.createElement('dt');
    const detail = document.createElement('dd');
    term.textContent = label;
    detail.textContent = value;
    item.append(term, detail);
    return item;
  });
  document.getElementById('say').replaceChildren(...interpretations);
  document.getElementById('placeholder').hidden = true;
  document.getElementById('result').hidden = false;
  tube.classList.add('drawn');
  go.textContent = '查看今日签文';
  hint.textContent = '今日已求签，明天可再求。';
}

function refreshDate() {
  const date = new Date();
  const key = todayKey(date);
  if (key === currentDate || go.disabled) return;
  currentDate = key;
  dateLabel.dateTime = [date.getFullYear(), date.getMonth() + 1, date.getDate()]
    .map(part => String(part).padStart(2, '0')).join('-');
  dateLabel.textContent = new Intl.DateTimeFormat('zh-CN', { dateStyle: 'full' }).format(date);
  drawn = false;
  try {
    drawn = localStorage.getItem('fortune:' + key) === '1';
  } catch {}
  if (drawn) {
    reveal();
    return;
  }
  tube.classList.remove('drawn');
  document.getElementById('placeholder').hidden = false;
  document.getElementById('result').hidden = true;
  go.textContent = '摇签';
  hint.textContent = '心里想一件事，再摇一支签。';
}

function focusResult() {
  resultTitle.focus({ preventScroll: true });
  resultTitle.scrollIntoView({ behavior: reducedMotion.matches ? 'instant' : 'smooth', block: 'nearest' });
}

refreshDate();
document.addEventListener('visibilitychange', refreshDate);
go.addEventListener('click', () => {
  refreshDate();
  if (drawn) {
    focusResult();
    return;
  }
  go.disabled = true;
  go.textContent = '摇签中…';
  tube.classList.add('shake');
  setTimeout(() => {
    tube.classList.remove('shake');
    drawn = true;
    try {
      localStorage.setItem('fortune:' + currentDate, '1');
    } catch {}
    go.disabled = false;
    reveal();
    focusResult();
  }, reducedMotion.matches ? 0 : 850);
});
</script>
</body>
</html>
